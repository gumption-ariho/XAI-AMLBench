# Local-dev only (loaded by traefik.local.yml -- see docker-compose.local.yml). A REAL, locally-trusted
# certificate for https://localhost, so your browser stops showing the "not private" warning entirely --
# instead of clicking through a self-signed cert every time, your machine actually trusts this one.
#
# One-time setup with mkcert (a small, well-known tool that makes a local root CA your OS/browser trusts,
# then issues real certs signed by it -- https://github.com/FiloSottile/mkcert):
#
#   brew install mkcert            # macOS -- or: apt install mkcert (Debian/Ubuntu), choco install mkcert (Windows)
#   mkcert -install                # one-time: adds mkcert's root CA to your OS and browser trust stores
#   mkdir -p traefik/certs
#   mkcert -cert-file traefik/certs/localhost.pem -key-file traefik/certs/localhost-key.pem localhost 127.0.0.1 ::1
#
# Then start the stack with BOTH compose files so this gets mounted in:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile app --profile ml up -d --build
#
# traefik/certs/ is gitignored -- these are YOUR machine's locally-trusted files, never meant to be shared or
# committed, and meaningless on anyone else's computer (mkcert's root CA is unique per machine). Skip this
# entirely and the self-signed fallback (click-through warning) still works exactly as before -- this is a
# convenience, not a requirement.
tls:
  certificates:
    - certFile: /certs/localhost.pem
      keyFile: /certs/localhost-key.pem
